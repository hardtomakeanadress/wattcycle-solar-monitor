name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # GitHub does not publish Python 3.9 builds for Ubuntu 26.04.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s dashboard -p 'test_*.py' -v
      - run: python -m unittest discover -s recovery -p 'test_*.py' -v
      - run: python -m compileall -q homeassistant/custom_components/cabana_events

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/test_frontend.cjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install development-only browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/wattcycle-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/wattcycle-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test real dashboard with temporary history
        env:
          NODE_PATH: ${{ runner.temp }}/wattcycle-browser/node_modules
          BROWSER_TEST_OUTPUT: ${{ runner.temp }}/wattcycle-browser-screenshots
        run: python scripts/test_browser_ci.py
