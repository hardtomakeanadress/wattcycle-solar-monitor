<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc">
  <title id="title">WattCycle controller to USB RS485 adapter signal mapping</title>
  <desc id="desc">Controller RJ12 pin 6 D plus connects to adapter D plus; pin 5 D minus connects to adapter D minus. Pins 1 and 2 VDD are unused. Pins 3 and 4 are ground; no separate adapter ground terminal is visible. This diagram does not represent physical pin positions.</desc>
  <rect width="1000" height="490" rx="16" fill="#f4f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b42">
    <text x="40" y="48" font-size="27" font-weight="700">WattCycle M-2430N · RS485 connection</text>
    <text x="40" y="79" font-size="17" fill="#52647a">Signal mapping only — use the manual for physical pin positions</text>
    <rect x="40" y="112" width="280" height="284" rx="12" fill="white" stroke="#bccbda"/>
    <rect x="600" y="112" width="350" height="284" rx="12" fill="white" stroke="#bccbda"/>
    <text x="60" y="147" font-size="21" font-weight="700">Controller RJ12</text>
    <text x="620" y="147" font-size="21" font-weight="700">USB / RS485 adapter</text>
    <text x="60" y="206" font-size="20">Pin 6 · D+</text>
    <text x="60" y="266" font-size="20">Pin 5 · D−</text>
    <text x="620" y="206" font-size="20">D+ signal</text>
    <text x="620" y="266" font-size="20">D− signal</text>
    <path d="M320 200H600" stroke="#087e8b" stroke-width="5"/>
    <path d="M320 260H600" stroke="#b95b19" stroke-width="5"/>
    <text x="460" y="185" text-anchor="middle" font-size="15" fill="#087e8b">RS485 positive</text>
    <text x="460" y="245" text-anchor="middle" font-size="15" fill="#b95b19">RS485 negative</text>
    <text x="60" y="324" font-size="16">Pins 1–2 · VDD: unused</text>
    <text x="60" y="350" font-size="16">Pins 3–4 · GND</text>
    <text x="620" y="317" font-size="16">Two field terminals; no GND shown</text>
    <text x="620" y="344" font-size="16">USB-A to Raspberry Pi · USB-powered</text>
    <text x="620" y="375" font-size="14" fill="#52647a">A/B labels and terminal positions unverified</text>
    <text x="40" y="435" font-size="18" font-weight="700">Modbus RTU · 9600 baud · 8N1 · address 1 · read function 03</text>
    <text x="40" y="464" font-size="15" fill="#52647a">Line colours distinguish signals; they do not specify cable wire colours.</text>
  </g>
</svg>
