    value_template: '{{ value_json.reading.load_on }}'
    availability: '{{ value_json is defined and value_json.get(''reading'') is mapping and not value_json.get(''stale'', true)
      and not value_json.get(''error'') }}'
    device_class: power
  - name: Cabana Alex Controller fault
    unique_id: cabana_alex_controller_fault
    value_template: '{{ value_json.reading.fault_bits != 0 }}'
    availability: '{{ value_json is defined and value_json.get(''reading'') is mapping and not value_json.get(''stale'', true)
      and not value_json.get(''error'') }}'
    device_class: problem
  - name: Cabana Alex Controller data problem
    unique_id: cabana_alex_controller_data_problem
    value_template: '{{ value_json.get(''stale'', true) or value_json.get(''error'') is not none }}'
    availability: '{{ value_json is defined and true }}'
    device_class: problem
  - name: Cabana Alex Controller CRC valid
    unique_id: cabana_alex_controller_crc
    value_template: '{{ value_json.reading.all_crc_valid }}'
    availability: '{{ value_json is defined and value_json.get(''reading'') is mapping and not value_json.get(''stale'', true)
      and not value_json.get(''error'') }}'
  - name: Cabana Alex Climate data problem
    unique_id: cabana_alex_climate_data_problem
    value_template: '{{ value_json.sensor.get(''stale'', true) or value_json.sensor.get(''error'') is not none }}'
    availability: '{{ value_json is defined and value_json.get(''sensor'') is mapping }}'
    device_class: problem
  - name: Cabana Alex Heating armed
    unique_id: cabana_alex_heating_armed
    value_template: '{{ value_json.heating.armed }}'
    availability: '{{ value_json is defined and value_json.get(''heating'') is mapping and value_json.heating.get(''armed'')
      is not none }}'
  - name: Cabana Alex Heating installation ready
    unique_id: cabana_alex_heating_ready
    value_template: '{{ value_json.heating.installation_ready }}'
    availability: '{{ value_json is defined and value_json.get(''heating'') is mapping and value_json.heating.get(''installation_ready'')
      is not none }}'
  - name: Cabana Alex Heating output
    unique_id: cabana_alex_heating_output
    value_template: '{{ value_json.heating.output_on }}'
    availability: '{{ value_json is defined and value_json.get(''heating'') is mapping and value_json.heating.get(''output_on'')
      is not none }}'
    device_class: heat
  - name: Cabana Alex SmartShunt Alarm
    unique_id: cabana_alex_shunt_alarm
    value_template: '{{ value_json.shunt.reading.alarm_bits != 0 }}'
    availability: '{{ value_json is mapping and value_json.get(''shunt'') is mapping and value_json.shunt.get(''enabled'',
      false) and value_json.shunt.get(''reading'') is mapping and not value_json.shunt.get(''stale'', true) and not value_json.shunt.get(''error'')
      and value_json.shunt.reading.get(''alarm_bits'') is not none }}'
    device_class: problem
  - name: Cabana Alex SmartShunt Data problem
    unique_id: cabana_alex_shunt_data_problem
    value_template: '{{ not value_json.shunt.get(''enabled'', false) or value_json.shunt.get(''stale'', true) or value_json.shunt.get(''error'')
      is not none or value_json.shunt.get(''reading'') is not mapping }}'
    availability: '{{ value_json is mapping and value_json.get(''shunt'') is mapping }}'
    device_class: problem
  - name: Cabana Alex History storage problem
    unique_id: cabana_alex_history_storage_problem
    value_template: '{{ value_json.history.get(''error'') is not none or value_json.history.get(''dropped_solar_samples'',
      0) > 0 or value_json.history.get(''dropped_sensor_samples'', 0) > 0 }}'
    availability: '{{ value_json is mapping and value_json.get(''history'') is mapping }}'
    device_class: problem
- resource: http://100.82.58.122:8080/api/system
  method: GET
  scan_interval: 30
  timeout: 10
  sensor:
  - name: Cabana Alex Pi temperature
    unique_id: cabana_alex_pi_temperature
    value_template: '{{ value_json.temperature_C | round(1) }}'
    availability: '{{ value_json is defined and value_json.get(''temperature_C'') is not none }}'
    unit_of_measurement: °C
    device_class: temperature
    state_class: measurement
  - name: Cabana Alex Pi uptime
    unique_id: cabana_alex_pi_uptime
    value_template: '{{ value_json.uptime_seconds }}'
    availability: '{{ value_json is defined and value_json.get(''uptime_seconds'') is not none }}'
    unit_of_measurement: s
    device_class: duration
    state_class: measurement
  - name: Cabana Alex Pi available memory
    unique_id: cabana_alex_pi_memory_available
    value_template: '{{ value_json.memory_available_bytes }}'
    availability: '{{ value_json is defined and value_json.get(''memory_available_bytes'') is not none }}'
    unit_of_measurement: B
    device_class: data_size
    state_class: measurement
  - name: Cabana Alex Pi free storage
    unique_id: cabana_alex_pi_storage_free
    value_template: '{{ value_json.storage_free_bytes }}'
    availability: '{{ value_json is defined and value_json.get(''storage_free_bytes'') is not none }}'
    unit_of_measurement: B
    device_class: data_size
    state_class: measurement
  - name: Cabana Alex Pi model
    unique_id: cabana_alex_pi_model
    value_template: '{{ value_json.model }}'
    availability: '{{ value_json is defined and value_json.get(''model'') is not none }}'
    json_attributes:
    - cpu_model
    - architecture
    - cpu_cores
    - os
    - kernel
    - python_version
    - memory_total_bytes
    - storage_total_bytes
    - throttle_since_boot
  - name: Cabana Alex Pi throttling
    unique_id: cabana_alex_pi_throttling
    value_template: '{{ value_json.throttle_current | join('', '') if value_json.throttle_current else ''None'' }}'
    availability: '{{ value_json is defined and value_json.get(''throttle_current'') is not none }}'
  - name: Cabana Alex Pi Uptime display
    unique_id: cabana_alex_pi_uptime_display
    value_template: '{%- set minutes = (value_json.uptime_seconds / 60) | int -%}{%- set total = minutes | round(0, ''ceil'')
      | int -%}

      {{ ((total // 1440) ~ '' d '') if total >= 1440 else '''' }}{{ (((total % 1440) // 60) ~ '' h '') if total >= 60 else
      '''' }}{{ total % 60 }} min'
    availability: '{{ value_json is mapping and value_json.get(''uptime_seconds'') is number }}'
    icon: mdi:timer-outline
  - name: Cabana Alex Pi Memory display
    unique_id: cabana_alex_pi_memory_display
    value_template: '{{ (value_json.memory_available_bytes / 1000000) | round(0) | int }} / {{ (value_json.memory_total_bytes
      / 1000000) | round(0) | int }} MB'
    availability: '{{ value_json is mapping and value_json.get(''memory_available_bytes'') is number and value_json.get(''memory_total_bytes'')
      is number }}'
    icon: mdi:memory
  - name: Cabana Alex Pi Storage display
    unique_id: cabana_alex_pi_storage_display
    value_template: '{{ (value_json.storage_free_bytes / 1000000000) | round(1) }} / {{ (value_json.storage_total_bytes /
      1000000000) | round(1) }} GB'
    availability: '{{ value_json is mapping and value_json.get(''storage_free_bytes'') is number and value_json.get(''storage_total_bytes'')
      is number }}'
    icon: mdi:harddisk
  - name: Cabana Alex Pi faults since boot
    unique_id: cabana_alex_pi_faults_since_boot
    value_template: '{{ value_json.throttle_since_boot | join('', '') if value_json.throttle_since_boot else ''None'' }}'
    availability: '{{ value_json is mapping and value_json.get(''throttle_since_boot'') is not none }}'
  binary_sensor: []
