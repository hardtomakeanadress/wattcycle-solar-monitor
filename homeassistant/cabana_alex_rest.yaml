  - name: Cabana Alex Discharge time display
    unique_id: cabana_alex_discharge_time_display
    value_template: '{%- set shunt = value_json.get(''shunt'') or {} -%}

      {%- set reading = shunt.get(''reading'') or {} -%}

      {%- set current = reading.get(''current_A'') -%}

      {%- set timers = value_json.get(''timers'') or {} -%}

      {%- if not shunt.get(''enabled'', false) or shunt.get(''stale'', true) or shunt.get(''error'') or not reading -%}

      No recent data

      {%- elif current is number and current > 0.05 -%}

      Charging

      {%- elif current is number and current < -0.05 -%}

      {%- set minutes = reading.get(''time_to_go_minutes'') -%}

      {%- if minutes is number and minutes >= 0 -%}

      {%- set total = minutes | round(0, ''ceil'') | int -%}

      {{ ((total // 1440) ~ '' d '') if total >= 1440 else '''' }}{{ (((total % 1440) // 60) ~ '' h '') if total >= 60 else
      '''' }}{{ total % 60 }} min

      {%- else -%}Calculating{%- endif -%}

      {%- elif current is number -%}Idle

      {%- else -%}No estimate{%- endif -%}'
    availability: '{{ value_json is defined and value_json is mapping }}'
    icon: mdi:timer-outline
  - name: Cabana Alex Charge time display
    unique_id: cabana_alex_charge_time_display
    value_template: '{%- set shunt = value_json.get(''shunt'') or {} -%}

      {%- set reading = shunt.get(''reading'') or {} -%}

      {%- set current = reading.get(''current_A'') -%}

      {%- set timers = value_json.get(''timers'') or {} -%}

      {%- if not shunt.get(''enabled'', false) or shunt.get(''stale'', true) or shunt.get(''error'') or not reading -%}

      No recent data

      {%- elif timers.get(''state'') == ''full'' -%}0 min

      {%- elif current is number and current < -0.05 -%}Discharging

      {%- elif current is number and current <= 0.05 -%}Idle

      {%- elif timers.get(''state'') == ''charging'' and timers.get(''charge_minutes'') is number and timers.charge_minutes
      >= 0 -%}

      {%- set minutes = timers.charge_minutes -%}

      {{ ''≈ '' }}{%- set total = minutes | round(0, ''ceil'') | int -%}

      {{ ((total // 1440) ~ '' d '') if total >= 1440 else '''' }}{{ (((total % 1440) // 60) ~ '' h '') if total >= 60 else
      '''' }}{{ total % 60 }} min

      {%- elif timers.get(''state'') == ''warming'' -%}Calculating

      {%- else -%}No estimate{%- endif -%}'
    availability: '{{ value_json is mapping }}'
    icon: mdi:timer-outline
