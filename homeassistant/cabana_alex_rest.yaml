- resource: http://100.82.58.122:8080/api/status
  method: GET
  scan_interval: 60
  timeout: 10
  sensor:
  - name: Cabana Alex Battery voltage
    unique_id: cabana_alex_battery_voltage
    value_template: '{{ value_json.reading.battery_V }}'
    availability: '{{ value_json is defined and value_json.get(''reading'') is mapping and not value_json.get(''stale'', true)
      and not value_json.get(''error'') and value_json.reading.get(''battery_V'') is not none }}'
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
